name: english_master_academy
description: "English Master Academy - App móvil de aprendizaje de inglés con contenido dinámico desde Firestore."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0

  # Estado y navegación
  provider: ^6.1.2
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Cuando agreguemos assets locales (no PDFs), descomentamos:
  # assets:
  #   - assets/images/
